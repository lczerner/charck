[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "charck"
version = "1.0.0"
description = "Check text files for non-ASCII characters, and repair them"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Lukáš Czerner", email = "lukas@czerner.cz" }]
keywords = [
    "unicode",
    "utf-8",
    "ascii",
    "zero-width",
    "invisible-characters",
    "homoglyph",
    "linter",
    "text",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]

# No dependencies, by design. tomllib is stdlib from 3.11, which is what sets
# requires-python above.
dependencies = []

[project.optional-dependencies]
# Development only. The tool itself still needs nothing outside the standard
# library; these are what `make lint` and `make test` run.
dev = [
    "flake8>=7.1",
    "pytest>=8.0",
]

[project.scripts]
charck = "charck:cli"

[project.urls]
Homepage = "https://github.com/lczerner/charck"
Issues = "https://github.com/lczerner/charck/issues"

[tool.setuptools]
# Single-module project: charck.py at the repo root, no package directory.
py-modules = ["charck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The test modules import their shared fixtures with `from conftest import`,
# which the default import mode allows and --import-mode=importlib does not.
pythonpath = ["tests"]
# A test that starts passing has to say so, not go quietly green.
xfail_strict = true
